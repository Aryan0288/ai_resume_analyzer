  <style>
    /* Instant HTML/CSS Splash Screen styles */
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0F1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #151D33 0%, #0A0F1D 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo-container {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 24px;
    }

    .splash-glow {
      position: absolute;
      top: 0;
      left: 0;

      filter: blur(18px);
      opacity: 0.6;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    .splash-logo {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: linear-gradient(135deg, #3525CD, #1E1B4B);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(53, 37, 205, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .splash-title {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-subtitle {
      color: #94A3B8;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      letter-spacing: 0.2px;
    }

    .splash-loader-bar {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #3525CD, #006A61, #6366F1);
      border-radius: 4px;
      animation: shimmerProgress 1.6s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.4; }
      100% { transform: scale(1.1); opacity: 0.75; }
    }

    @keyframes shimmerProgress {
      0% { left: -45%; width: 45%; }
      50% { width: 70%; }
      100% { left: 100%; width: 45%; }
    }
  </style>
</head>

    <div class="splash-loader-bar">
      <div class="splash-loader-progress"></div>
    </div>
  </div>

  <script>
    function removeSplashScreen() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 450);
      }
    }

    // Hide splash screen on first frame or window load fallback
    window.addEventListener('flutter-first-frame', removeSplashScreen);
    window.addEventListener('load', function() {
      setTimeout(removeSplashScreen, 1800);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
